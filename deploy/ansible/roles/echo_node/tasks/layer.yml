---
# Installs one layer on this host: its jar and its environment file. Does not start it.
# vars: layer (a key of echo_layers), and for a metagraph validator or an L1: metagraph_id.
- name: "{{ layer }} | settings"
  ansible.builtin.set_fact:
    L: "{{ echo_layers[layer] }}"
    is_lead: "{{ inventory_hostname == groups[echo_layers[layer].group][0] }}"
    layer_home: "{{ echo_var }}/{{ layer }}"

- name: "{{ layer }} | jar"
  ansible.builtin.copy:
    src: "{{ L.jar }}"
    dest: "{{ echo_opt }}/jars/{{ layer }}.jar"
    mode: "0644"

- name: "{{ layer }} | working directory"
  ansible.builtin.file:
    path: "{{ layer_home }}"
    state: directory
    owner: "{{ echo_user }}"
    group: "{{ echo_user }}"
    mode: "0750"

- name: "{{ layer }} | has this layer already been created here?"
  ansible.builtin.find:
    paths: "{{ layer_home }}/data/incremental_snapshot"
    file_type: any
  register: existing_chain

# Genesis inputs go to the lead only, and only until the layer exists.
- name: "{{ layer }} | genesis file"
  ansible.builtin.copy:
    src: "{{ echo_network_dir }}/{{ L.genesis }}"
    dest: "{{ echo_etc }}/{{ layer }}-genesis.csv"
    mode: "0644"
  when: is_lead and L.genesis is defined

- name: "{{ layer }} | owner key (removed again once the metagraph exists)"
  ansible.builtin.copy:
    src: "{{ echo_secrets_dir }}/{{ L.owner }}.p12"
    dest: "{{ echo_etc }}/keys/{{ L.owner }}.p12"
    group: "{{ echo_user }}"
    mode: "0640"
  when: is_lead and L.owner is defined and existing_chain.matched == 0

- name: "{{ layer }} | environment"
  ansible.builtin.template:
    src: layer.env.j2
    dest: "{{ echo_etc }}/{{ layer }}.env"
    group: "{{ echo_user }}"
    mode: "0640"
  vars:
    with_owner: "{{ is_lead and L.owner is defined and existing_chain.matched == 0 }}"
  no_log: true
