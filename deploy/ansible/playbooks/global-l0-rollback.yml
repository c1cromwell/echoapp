---
# Restarts the WHOLE Global L0 from its newest snapshot. For an outage that left the network
# unable to produce snapshots: every node down, or (seen in rehearsal) two of three down at once,
# after which the survivor stalls and returning nodes wait on it for ever.
# Not needed while snapshots still advance: a stopped node simply rejoins (global-l0-join.yml).
#
#   ansible-playbook -i <inventory> playbooks/global-l0-rollback.yml -e echo_secrets_dir=...
#
# It stops every node, finds the node holding the newest snapshot, restores from that snapshot
# there, and rejoins the others one at a time. Metagraph nodes are left running; they resume when
# global snapshots do. Snapshots newer than the chosen one exist on no node, so nothing agreed is lost.
# To restore from an OLDER snapshot on purpose, pass -e echo_rollback_hash=<hash> -e echo_rollback_host=<host>;
# metagraph nodes that already saw later snapshots will then need their own rollback.
- name: Stop every Global L0 node and read its newest snapshot
  hosts: gl0
  become: true
  tasks:
    - name: Prepare host
      ansible.builtin.import_role: { name: echo_node }
    - name: Stop
      ansible.builtin.systemd: { name: echo-node@global-l0, state: stopped }
    - name: Newest snapshot on disk
      ansible.builtin.command: "{{ echo_opt }}/bin/latest-snapshot.sh {{ echo_var }}/global-l0"
      register: newest
      changed_when: false

- name: Choose the snapshot
  hosts: gl0
  gather_facts: false
  tasks:
    - name: This node's newest snapshot
      ansible.builtin.set_fact:
        newest_ordinal: "{{ newest.stdout.split()[0] | int }}"
        newest_hash: "{{ newest.stdout.split()[1] }}"
    # Every host computes the same answer, so each one knows whether it is the chosen node.
    - name: Pick the node with the newest snapshot
      ansible.builtin.set_fact:
        echo_rollback_host: "{{ echo_rollback_host | default(best.inventory_hostname) }}"
        echo_rollback_hash: "{{ echo_rollback_hash | default(best.newest_hash) }}"
        top_hashes: "{{ all_nodes | selectattr('newest_ordinal', 'eq', best.newest_ordinal) | map(attribute='newest_hash') | unique | list }}"
      vars:
        all_nodes: "{{ groups['gl0'] | map('extract', hostvars) | list }}"
        best: "{{ all_nodes | sort(attribute='newest_ordinal') | last }}"
    - name: Nodes at the same ordinal must hold the same snapshot
      ansible.builtin.assert:
        that: top_hashes | length == 1
        fail_msg: "Nodes disagree on the newest snapshot: {{ top_hashes }}. Stop and investigate before restoring."
    - name: Report
      ansible.builtin.debug:
        msg: "Restoring from {{ echo_rollback_hash }} on {{ echo_rollback_host }}"
      run_once: true

- name: Restore on the chosen node
  hosts: gl0
  become: true
  vars: { layer: global-l0 }
  tasks:
    - name: Restore
      when: inventory_hostname == echo_rollback_host
      block:
        - name: Install layer with the rollback hash
          ansible.builtin.include_role: { name: echo_node, tasks_from: layer }
        - name: Start
          ansible.builtin.include_tasks: tasks-start.yml
        # Otherwise an ordinary restart during a later outage would rewind the chain to this point.
        - name: Remove the rollback hash
          ansible.builtin.lineinfile:
            path: "{{ echo_etc }}/global-l0.env"
            regexp: "^ECHO_ROLLBACK_HASH="
            state: absent

- name: Rejoin the other nodes, one at a time
  hosts: gl0
  become: true
  serial: 1
  vars: { layer: global-l0 }
  tasks:
    - name: Start
      ansible.builtin.include_tasks: tasks-start.yml
      when: inventory_hostname != echo_rollback_host
