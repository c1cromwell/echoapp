---
# Starts one layer on this host and waits until it is Ready. vars: layer
- name: "{{ layer }} | start"
  ansible.builtin.systemd:
    name: "echo-node@{{ layer }}"
    state: started
    enabled: true

- name: "{{ layer }} | wait until Ready"
  ansible.builtin.uri:
    url: "http://{{ chain_ip }}:{{ echo_layers[layer].port }}/node/info"
    return_content: true
  register: info
  until: info.status == 200 and info.json.state == 'Ready'
  # 40 minutes: a join that stalls is restarted by the launcher after 7, and may need a few tries.
  retries: "{{ echo_ready_retries | default(240) }}"
  delay: 10
