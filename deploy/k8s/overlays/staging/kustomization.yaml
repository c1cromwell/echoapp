apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: echo-staging
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ghcr.io/c1cromwell/echo-backend
    newTag: staging
replicas:
  - name: echo-backend
    count: 2
patches:
  - target:
      kind: Ingress
      name: echo-backend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.echo.app
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.staging.echo.app
  - target:
      kind: ConfigMap
      name: echo-backend-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: staging
