apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-backend-config
data:
  API_PORT: "8000"
  ENVIRONMENT: "production"
  # Number of reverse proxies in front of the pod that set X-Forwarded-For; the API uses it to find
  # the real client address for per-IP rate limits and ignores the header when this is 0/unset.
  # 1 = ingress-nginx alone (its default replaces the header with the address it saw). If the
  # Hetzner load balancer terminates HTTP in front of it, enable use-forwarded-headers in the
  # ingress-nginx ConfigMap and set this to 2, or every client shares the load balancer's address.
  TRUSTED_PROXY_HOPS: "1"
  # Postgres + Redis run on the private DB VM (10.0.1.50) provisioned by deploy/terraform/hetzner.
  DATABASE_HOST: "10.0.1.50"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "echoapp"
  DATABASE_USER: "echoapp"
  DATABASE_SSLMODE: "require"
  REDIS_HOST: "10.0.1.50"
  REDIS_PORT: "6379"
  # Echo's own chain: a private Hyperledger Besu network (docs/BESU_MIGRATION_PLAN.md).
  # "besu" is the only accepted value; anything else fails startup.
  ECHO_CHAIN_NETWORK: "besu"
  # JSON-RPC endpoints of the validators, on the private network. The gateway uses the first that
  # answers. REPLACE_ME until the staging deploy (plan stage B4) fixes the addresses; with these
  # placeholders the gateway refuses to start, which is intended: production must not run
  # without anchoring by accident.
  BESU_RPC_URLS: "http://REPLACE_ME:8545"
  BESU_ANCHOR_CONTRACT: "REPLACE_ME"
  # Constellation-hosted Digital Evidence API. The client is constructed only
  # when this is "true" and DIGITAL_EVIDENCE_API_KEY is set.
  DIGITAL_EVIDENCE_ENABLED: "false"
  # Accept Apple-signed Sandbox purchases (TestFlight / App Review). Set to
  # "false" once only App Store builds should earn VIP.
  VIP_ALLOW_SANDBOX_STOREKIT: "true"
