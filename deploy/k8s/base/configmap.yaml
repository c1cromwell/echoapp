apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-backend-config
data:
  API_PORT: "8000"
  ENVIRONMENT: "production"
  # Number of reverse proxies in front of the pod that set X-Forwarded-For; the API uses it to find
  # the real client address for per-IP rate limits and ignores the header when this is 0/unset.
  # 1 = ingress-nginx alone (its default replaces the header with the address it saw). If the
  # Hetzner load balancer terminates HTTP in front of it, enable use-forwarded-headers in the
  # ingress-nginx ConfigMap and set this to 2, or every client shares the load balancer's address.
  TRUSTED_PROXY_HOPS: "1"
  # Postgres + Redis run on the private DB VM (10.0.1.50) provisioned by deploy/terraform/hetzner.
  DATABASE_HOST: "10.0.1.50"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "echoapp"
  DATABASE_USER: "echoapp"
  DATABASE_SSLMODE: "require"
  REDIS_HOST: "10.0.1.50"
  REDIS_PORT: "6379"
  # Chain network the gateway anchors to: "sovereign" (Echo's own chain) or
  # "constellation" (Constellation's public network). Any other value fails startup.
  ECHO_CHAIN_NETWORK: "sovereign"
  # Constellation-hosted Digital Evidence API. The client is constructed only
  # when this is "true" and DIGITAL_EVIDENCE_API_KEY is set.
  DIGITAL_EVIDENCE_ENABLED: "false"
  # Echo's own chain (docs/OWN_L0_PLAN.md). Every chain node is on the private network with a
  # fixed address set by deploy/terraform/hetzner/gl0-nodes.tf — Global L0 at 10.0.2.11-13,
  # metagraph hosts at 10.0.2.21-23 — the same in every environment, so no overlay is needed.
  # Ports are the production layout from deploy/ansible/playbooks/group_vars/all.yml (Global L0 9000,
  # Metagraph L0 9100, Currency L1 9200, Data L1 9300, Identity L1 9500, Identity L0 9600).
  # The local dev cluster uses different ports; do not copy them here.
  # Each URL names one node. If that node is down the gateway loses that layer until it returns
  # or this value is changed; spreading requests across nodes is stage 3 work.
  GLOBAL_L0_URL: "http://10.0.2.11:9000"
  # Also switches on the anchor finality tracker, which archives signed snapshots.
  METAGRAPH_L0_URL: "http://10.0.2.21:9100"
  CURRENCY_L1_URL: "http://10.0.2.21:9200"
  DATA_L1_URL: "http://10.0.2.21:9300"
  IDENTITY_L0_URL: "http://10.0.2.21:9600"
  IDENTITY_L1_URL: "http://10.0.2.21:9500"
  # Accept Apple-signed Sandbox purchases (TestFlight / App Review). Set to
  # "false" once only App Store builds should earn VIP.
  VIP_ALLOW_SANDBOX_STOREKIT: "true"
