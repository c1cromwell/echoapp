# Copy to inventory.ini and fill in. One line per validator; node_index must be 1-4 and match the
# key ceremony's node1..node4 directories. private_ip is the address on the private network.
[validators]
echo-besu-1 ansible_host=PUBLIC_OR_BASTION_ADDRESS private_ip=10.0.2.11 node_index=1
echo-besu-2 ansible_host=PUBLIC_OR_BASTION_ADDRESS private_ip=10.0.2.12 node_index=2
echo-besu-3 ansible_host=PUBLIC_OR_BASTION_ADDRESS private_ip=10.0.2.13 node_index=3
echo-besu-4 ansible_host=PUBLIC_OR_BASTION_ADDRESS private_ip=10.0.2.14 node_index=4

[validators:vars]
ansible_user=root
# Directory on the machine running Ansible that holds the key ceremony's output:
# genesis.json and node1..node4/key. It is read from this machine and never stored in the repo.
ceremony_dir=/path/to/ceremony/output
besu_image=hyperledger/besu:26.11.2
# Private subnets allowed to reach JSON-RPC (the gateway) and metrics (monitoring).
gateway_cidr=10.0.1.0/24
