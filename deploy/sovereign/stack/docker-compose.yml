# Rehearsal of the production-shaped Echo network on one machine (docs/OWN_L0_PLAN.md stage 2):
# three Global L0 nodes, and three metagraph hosts each running Metagraph L0, Currency L1, Data L1,
# Identity L0 and Identity L1. Every process starts through the production launcher
# (../node/echo-node.sh) with an enforced seedlist and the signer allowlists set.
#
# Node 1 of each layer is published on the ports `make dev` uses (9000 / 9200 / 9300 / 9400 /
# 9600 / 9500), so the gateway and `make validate-phase1` work unchanged. Do not run both at once.
# Start with `make sovereign-up`; it builds the jars and exports the gateway's signing key id.
name: echo-sovereign
x-node: &node
  image: ${ECHO_NODE_IMAGE:-metagraph-base-image:latest}
  entrypoint: ["/rehearsal-entrypoint.sh"]
  restart: unless-stopped
  volumes:
    - ./rehearsal-entrypoint.sh:/rehearsal-entrypoint.sh:ro
    - ../node/echo-node.sh:/echo-node.sh:ro
    - ../../../metagraph/modules/l0/target/scala-2.13/echo-currency-l0-assembly-0.1.0-SNAPSHOT.jar:/jars/l0.jar:ro
    - ../../../metagraph/modules/l1/target/scala-2.13/echo-currency-l1-assembly-0.1.0-SNAPSHOT.jar:/jars/l1.jar:ro
    - ../../../metagraph/modules/data_l1/target/scala-2.13/echo-data-l1-assembly-0.1.0-SNAPSHOT.jar:/jars/data_l1.jar:ro
    - ../../../metagraph/modules/identity_l0/target/scala-2.13/echo-identity-l0-assembly-0.1.0-SNAPSHOT.jar:/jars/identity_l0.jar:ro
    - ../../../metagraph/modules/identity_l1/target/scala-2.13/echo-identity-l1-assembly-0.1.0-SNAPSHOT.jar:/jars/identity_l1.jar:ro
    - shared:/shared
    - data:/data
x-env: &env
  CL_PASSWORD: ${ECHO_REHEARSAL_KEY_PASSWORD:-rehearsal-only}
  DATA_AUTHORIZED_SIGNERS: ${IDENTITY_SERVICE_PUBLIC_KEY_HEX:?start with make sovereign-up}
  IDENTITY_SERVICE_PUBLIC_KEY_HEX: ${IDENTITY_SERVICE_PUBLIC_KEY_HEX}
  IDENTITY_SERVICE_DID: ${IDENTITY_SERVICE_DID:?start with make sovereign-up}
# One container per metagraph host owns the address; that host's five layers share its network.
x-host: &host
  image: ${ECHO_NODE_IMAGE:-metagraph-base-image:latest}
  entrypoint: ["sleep", "infinity"]
  restart: unless-stopped
  stop_grace_period: 1s
services:
  mg-1:
    <<: *host
    container_name: echo-sov-mg-1
    ports: ["9200:9100", "9300:9200", "9400:9300", "9600:9600", "9500:9500"]
    networks: { sov: { ipv4_address: 172.61.0.21 } }
  mg-2:
    <<: *host
    container_name: echo-sov-mg-2
    networks: { sov: { ipv4_address: 172.61.0.22 } }
  mg-3:
    <<: *host
    container_name: echo-sov-mg-3
    networks: { sov: { ipv4_address: 172.61.0.23 } }
  global-l0-1:
    <<: *node
    container_name: echo-sov-global-l0-1
    environment: { <<: *env, HOST: gl0-1, LAYER: global-l0, IP: 172.61.0.11, ECHO_JAVA_OPTS: "-Xms256m -Xmx1g" }
    ports: ["9000:9000"]
    networks: { sov: { ipv4_address: 172.61.0.11 } }
  global-l0-2:
    <<: *node
    container_name: echo-sov-global-l0-2
    environment: { <<: *env, HOST: gl0-2, LAYER: global-l0, IP: 172.61.0.12, ECHO_JAVA_OPTS: "-Xms256m -Xmx1g" }
    networks: { sov: { ipv4_address: 172.61.0.12 } }
  global-l0-3:
    <<: *node
    container_name: echo-sov-global-l0-3
    environment: { <<: *env, HOST: gl0-3, LAYER: global-l0, IP: 172.61.0.13, ECHO_JAVA_OPTS: "-Xms256m -Xmx1g" }
    networks: { sov: { ipv4_address: 172.61.0.13 } }
  metagraph-l0-1:
    <<: *node
    container_name: echo-sov-metagraph-l0-1
    environment: { <<: *env, HOST: mg-1, LAYER: metagraph-l0, IP: 172.61.0.21, ECHO_JAVA_OPTS: "-Xms256m -Xmx1g" }
    network_mode: "service:mg-1"
    depends_on: [mg-1]
  metagraph-l0-2:
    <<: *node
    container_name: echo-sov-metagraph-l0-2
    environment: { <<: *env, HOST: mg-2, LAYER: metagraph-l0, IP: 172.61.0.22, ECHO_JAVA_OPTS: "-Xms256m -Xmx1g" }
    network_mode: "service:mg-2"
    depends_on: [mg-2]
  metagraph-l0-3:
    <<: *node
    container_name: echo-sov-metagraph-l0-3
    environment: { <<: *env, HOST: mg-3, LAYER: metagraph-l0, IP: 172.61.0.23, ECHO_JAVA_OPTS: "-Xms256m -Xmx1g" }
    network_mode: "service:mg-3"
    depends_on: [mg-3]
  currency-l1-1:
    <<: *node
    container_name: echo-sov-currency-l1-1
    environment: { <<: *env, HOST: mg-1, LAYER: currency-l1, IP: 172.61.0.21, ECHO_JAVA_OPTS: "-Xms256m -Xmx640m" }
    network_mode: "service:mg-1"
    depends_on: [mg-1]
  currency-l1-2:
    <<: *node
    container_name: echo-sov-currency-l1-2
    environment: { <<: *env, HOST: mg-2, LAYER: currency-l1, IP: 172.61.0.22, ECHO_JAVA_OPTS: "-Xms256m -Xmx640m" }
    network_mode: "service:mg-2"
    depends_on: [mg-2]
  currency-l1-3:
    <<: *node
    container_name: echo-sov-currency-l1-3
    environment: { <<: *env, HOST: mg-3, LAYER: currency-l1, IP: 172.61.0.23, ECHO_JAVA_OPTS: "-Xms256m -Xmx640m" }
    network_mode: "service:mg-3"
    depends_on: [mg-3]
  data-l1-1:
    <<: *node
    container_name: echo-sov-data-l1-1
    environment: { <<: *env, HOST: mg-1, LAYER: data-l1, IP: 172.61.0.21, ECHO_JAVA_OPTS: "-Xms256m -Xmx640m" }
    network_mode: "service:mg-1"
    depends_on: [mg-1]
  data-l1-2:
    <<: *node
    container_name: echo-sov-data-l1-2
    environment: { <<: *env, HOST: mg-2, LAYER: data-l1, IP: 172.61.0.22, ECHO_JAVA_OPTS: "-Xms256m -Xmx640m" }
    network_mode: "service:mg-2"
    depends_on: [mg-2]
  data-l1-3:
    <<: *node
    container_name: echo-sov-data-l1-3
    environment: { <<: *env, HOST: mg-3, LAYER: data-l1, IP: 172.61.0.23, ECHO_JAVA_OPTS: "-Xms256m -Xmx640m" }
    network_mode: "service:mg-3"
    depends_on: [mg-3]
  identity-l0-1:
    <<: *node
    container_name: echo-sov-identity-l0-1
    environment: { <<: *env, HOST: mg-1, LAYER: identity-l0, IP: 172.61.0.21, ECHO_JAVA_OPTS: "-Xms256m -Xmx1g" }
    network_mode: "service:mg-1"
    depends_on: [mg-1]
  identity-l0-2:
    <<: *node
    container_name: echo-sov-identity-l0-2
    environment: { <<: *env, HOST: mg-2, LAYER: identity-l0, IP: 172.61.0.22, ECHO_JAVA_OPTS: "-Xms256m -Xmx1g" }
    network_mode: "service:mg-2"
    depends_on: [mg-2]
  identity-l0-3:
    <<: *node
    container_name: echo-sov-identity-l0-3
    environment: { <<: *env, HOST: mg-3, LAYER: identity-l0, IP: 172.61.0.23, ECHO_JAVA_OPTS: "-Xms256m -Xmx1g" }
    network_mode: "service:mg-3"
    depends_on: [mg-3]
  identity-l1-1:
    <<: *node
    container_name: echo-sov-identity-l1-1
    environment: { <<: *env, HOST: mg-1, LAYER: identity-l1, IP: 172.61.0.21, ECHO_JAVA_OPTS: "-Xms256m -Xmx640m" }
    network_mode: "service:mg-1"
    depends_on: [mg-1]
  identity-l1-2:
    <<: *node
    container_name: echo-sov-identity-l1-2
    environment: { <<: *env, HOST: mg-2, LAYER: identity-l1, IP: 172.61.0.22, ECHO_JAVA_OPTS: "-Xms256m -Xmx640m" }
    network_mode: "service:mg-2"
    depends_on: [mg-2]
  identity-l1-3:
    <<: *node
    container_name: echo-sov-identity-l1-3
    environment: { <<: *env, HOST: mg-3, LAYER: identity-l1, IP: 172.61.0.23, ECHO_JAVA_OPTS: "-Xms256m -Xmx640m" }
    network_mode: "service:mg-3"
    depends_on: [mg-3]
volumes: { shared: {}, data: {} }
networks:
  sov:
    ipam: { config: [{ subnet: 172.61.0.0/24 }] }
