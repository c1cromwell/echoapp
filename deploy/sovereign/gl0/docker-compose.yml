# Echo sovereign Global L0 — three-node cluster on one machine (spike S1 and local testing).
# Isolated from `make dev`: own network, own volumes, host ports 19000/19010/19020.
name: echo-gl0
x-node: &node
  image: ${GL0_IMAGE:-metagraph-base-image:latest}
  entrypoint: ["/entrypoint.sh"]
  restart: "no"
  volumes:
    - ./entrypoint.sh:/entrypoint.sh:ro
    - shared:/shared
    - data:/data
x-env: &env
  GL0_NODE_COUNT: "3"
  GL0_PEERS: "gl0-1=172.60.0.11 gl0-2=172.60.0.12 gl0-3=172.60.0.13"
  CL_PASSWORD: ${GL0_KEY_PASSWORD:-local-spike-only}
services:
  gl0-1:
    <<: *node
    container_name: echo-gl0-1
    environment: { <<: *env, GL0_NAME: gl0-1, GL0_IP: 172.60.0.11, GL0_ROLE: genesis }
    ports: ["19000:9000"]
    networks: { gl0: { ipv4_address: 172.60.0.11 } }
  gl0-2:
    <<: *node
    container_name: echo-gl0-2
    environment: { <<: *env, GL0_NAME: gl0-2, GL0_IP: 172.60.0.12, GL0_ROLE: validator }
    ports: ["19010:9000"]
    networks: { gl0: { ipv4_address: 172.60.0.12 } }
  gl0-3:
    <<: *node
    container_name: echo-gl0-3
    environment: { <<: *env, GL0_NAME: gl0-3, GL0_IP: 172.60.0.13, GL0_ROLE: validator }
    ports: ["19020:9000"]
    networks: { gl0: { ipv4_address: 172.60.0.13 } }
volumes: { shared: {}, data: {} }
networks:
  gl0:
    ipam: { config: [{ subnet: 172.60.0.0/24 }] }
