# docker-compose.identity.yml
# Starts the custom Identity L0 and Identity L1 metagraph nodes.
#
# The Identity metagraph is a SEPARATE metagraph from the Euclid currency/data
# metagraph and is intentionally NOT managed by Euclid hydra: stock hydra
# (euclid v0.19.0) only orchestrates a single metagraph (global-l0, metagraph-l0,
# currency-l1, data-l1) and has no concept of identity layers. See
# docs/adr/0002-identity-metagraph-deployment.md.
#
# Prerequisites:
#   1. Euclid dev cluster running (`make dev`) — provides the Global L0 at
#      172.50.0.10:9000 on the `custom-network` Docker network, and the
#      `metagraph-base-image:latest` image (which bundles the cl-wallet /
#      cl-keytool CLI tools and a genesis.csv this compose reuses).
#   2. Assembled fat JARs:  cd metagraph && sbt identityL0/assembly identityL1/assembly
#
# Usage:
#   make start-identity        (preferred — checks JARs + base image first)
#   docker compose -f docker-compose.identity.yml up -d
#
# Ports / static IPs (custom-network, subnet 172.50.0.0/24; Euclid nodes use
# .10/.20/.30 so Identity uses .50/.51 to avoid collisions):
#   Identity L0: 172.50.0.50  -> 9600 (public) 9601 (p2p) 9602 (cli)
#   Identity L1: 172.50.0.51  -> 9500 (public) 9501 (p2p) 9502 (cli)
#
# Boot flow mirrors Euclid's metagraph-l0 genesis + currency-l1 initial-validator
# for Tessellation 4.0.0-rc.0; the per-node logic lives in scripts/identity/*.sh.

x-identity-base: &identity-base
  image: metagraph-base-image:latest
  restart: unless-stopped
  environment: &identity-env
    CL_APP_ENV: dev
    CL_COLLATERAL: "0"
    # Dedicated Identity metagraph key (generated on first boot into the shared
    # volume). MUST differ from the cluster's token-key.p12 — reusing that key's
    # owner address fails Global L0 registration with AddressAlreadyInUse, since
    # it already owns the main currency metagraph.
    CL_KEYSTORE: /shared-identity/identity.p12
    CL_KEYALIAS: identity
    CL_PASSWORD: password
    # Global L0 lead (Euclid node-1) reachable on the shared hydra network.
    CL_GLOBAL_L0_PEER_HTTP_HOST: "172.50.0.10"
    CL_GLOBAL_L0_PEER_HTTP_PORT: "9000"

services:

  identity-l0:
    <<: *identity-base
    container_name: identity-l0
    ports:
      - "9600:9600"
      - "9601:9601"
      - "9602:9602"
    volumes:
      - ./metagraph/modules/identity_l0/target/scala-2.13:/jars:ro
      - ./scripts/identity/l0-entrypoint.sh:/identity/l0-entrypoint.sh:ro
      # Holds the generated identity.p12 key + the published genesis address.
      - identity-shared:/shared-identity
    environment:
      <<: *identity-env
      CL_PUBLIC_HTTP_PORT: "9600"
      CL_P2P_HTTP_PORT: "9601"
      CL_CLI_HTTP_PORT: "9602"
      IDENTITY_L0_IP: "172.50.0.50"
    networks:
      custom-network:
        ipv4_address: 172.50.0.50
    command: ["bash", "/identity/l0-entrypoint.sh"]

  identity-l1:
    <<: *identity-base
    container_name: identity-l1
    ports:
      - "9500:9500"
      - "9501:9501"
      - "9502:9502"
    volumes:
      - ./metagraph/modules/identity_l1/target/scala-2.13:/jars:ro
      - ./scripts/identity/l1-entrypoint.sh:/identity/l1-entrypoint.sh:ro
      # Shares identity-l0's generated key (same node identity runs L0 + L1, as in
      # hydra) and reads the published genesis address.
      - identity-shared:/shared-identity
    environment:
      <<: *identity-env
      CL_PUBLIC_HTTP_PORT: "9500"
      CL_P2P_HTTP_PORT: "9501"
      CL_CLI_HTTP_PORT: "9502"
      # Dial identity-l0 (this metagraph's own L0), not the Global L0.
      CL_L0_PEER_HTTP_HOST: "172.50.0.50"
      CL_L0_PEER_HTTP_PORT: "9600"
      IDENTITY_L1_IP: "172.50.0.51"
    networks:
      custom-network:
        ipv4_address: 172.50.0.51
    command: ["bash", "/identity/l1-entrypoint.sh"]
    depends_on:
      - identity-l0

networks:
  custom-network:
    external: true

volumes:
  identity-shared:
