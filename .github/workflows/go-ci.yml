name: Go CI

on:
  push:
    branches: [main, develop]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-ci.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
        continue-on-error: true

  t0-t7-classification:
    name: T0–T7 Data Classification (WO-217)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run T0–T7 classification rules (Go)
        # ERROR-severity findings fail the job; WARNING findings are advisory.
        # Rules live in .semgrep/t0_t7_rules.yaml — add new patterns there.
        run: |
          semgrep \
            --config .semgrep/t0_t7_rules.yaml \
            --error \
            --severity ERROR \
            --include="*.go" \
            --exclude-dir=vendor \
            --exclude-dir=.git \
            . || (echo "::error::T0–T7 classification violations found. See docs/data-classification.md for remediation." && exit 1)

      - name: Run T0–T7 classification rules (advisory warnings)
        # Warnings are reported but do not fail the build.
        run: |
          semgrep \
            --config .semgrep/t0_t7_rules.yaml \
            --severity WARNING \
            --include="*.go" \
            --exclude-dir=vendor \
            --exclude-dir=.git \
            . 2>&1 | sed 's/^/::warning::/' || true
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -count=1 ./internal/...

      - name: Run integration tests
        run: go test -v -race -count=1 ./test/integration/...

      - name: Run crypto tests
        run: go test -v -race -count=1 ./internal/crypto/...

  test-coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Display coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -ldflags="-s -w" -o echoapp main.go

      - name: Verify binary runs
        run: |
          ./echoapp &
          sleep 2
          curl -sf http://localhost:8000/health || exit 1
          kill %1
