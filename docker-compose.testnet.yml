services:
  # =========================================================================
  # Echo Go backend for local development. It anchors to Echo's local chain:
  # four Besu validators started by `make dev` (deploy/besu/local), reached on
  # the host via host.docker.internal:8545-8548. This file owns the backend
  # stack only; the chain's settings come from deploy/besu/local/.network/chain.env.
  # =========================================================================

  echoapp:
    build:
      context: .
      dockerfile: build/Dockerfile
    container_name: echoapp-testnet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - API_PORT=8000
      - ENVIRONMENT=development
      # Opt-in, local only: accept Xcode .storekit test transactions, which are not
      # signed by Apple (VIP_ALLOW_UNVERIFIED_STOREKIT=true make testnet-up).
      # Ignored when ENVIRONMENT=production; never set it there.
      - VIP_ALLOW_UNVERIFIED_STOREKIT=${VIP_ALLOW_UNVERIFIED_STOREKIT:-false}
      - DEV_MODE=${DEV_MODE:-false}
      - ALLOW_DEV_OTP=${ALLOW_DEV_OTP:-false}
      - LOG_LEVEL=debug
      # Backing services (in-cluster)
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=echoapp
      - DATABASE_USER=echoapp
      - DATABASE_PASSWORD=echoapp_dev
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
      # Object storage (MinIO)
      - STORAGE_BACKEND=s3
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_REGION=us-east-1
      - STORAGE_BUCKET=echo-media
      - STORAGE_ACCESS_KEY_ID=minioadmin
      - STORAGE_SECRET_ACCESS_KEY=minioadmin
      - STORAGE_FORCE_PATH_STYLE=true
      # Echo's chain. Empty BESU_RPC_URLS (chain not started) leaves anchoring off.
      - ECHO_CHAIN_NETWORK=besu
      - BESU_RPC_URLS=${BESU_RPC_URLS_DOCKER:-}
      - BESU_ANCHOR_CONTRACT=${BESU_ANCHOR_CONTRACT:-}
      - BESU_IDENTITY_CONTRACT=${BESU_IDENTITY_CONTRACT:-}
      # Constellation-hosted Digital Evidence stays off unless explicitly enabled.
      - DIGITAL_EVIDENCE_ENABLED=${DIGITAL_EVIDENCE_ENABLED:-false}
      - IDENTITY_SERVICE_DID=${IDENTITY_SERVICE_DID:-}
      - IDENTITY_SERVICE_KEY_PEM=/app/.keys/identity-service.pem
    volumes:
      - ./migrations:/app/migrations:ro
      - ./.keys:/app/.keys:ro
    networks:
      - echo-testnet
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: echo-postgres-testnet
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: echoapp
      POSTGRES_USER: echoapp
      POSTGRES_PASSWORD: echoapp_dev
    volumes:
      - postgres-testnet-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoapp -d echoapp"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - echo-testnet

  redis:
    image: redis:7-alpine
    container_name: echo-redis-testnet
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-testnet-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - echo-testnet

  nats:
    image: nats:2-alpine
    container_name: echo-nats-testnet
    ports:
      - "4222:4222"
      - "8222:8222"
    command: --http_port 8222 -js
    volumes:
      - nats-testnet-data:/data
    networks:
      - echo-testnet

  minio:
    image: minio/minio:latest
    container_name: echo-minio-testnet
    ports:
      - "9700:9000"
      - "9701:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-testnet-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - echo-testnet

  minio-init:
    image: minio/mc:latest
    container_name: echo-minio-init-testnet
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/echo-media &&
        echo 'Bucket echo-media ready'
      "
    networks:
      - echo-testnet

volumes:
  postgres-testnet-data:
  redis-testnet-data:
  nats-testnet-data:
  minio-testnet-data:

networks:
  echo-testnet:
    name: echo-testnet
    driver: bridge
