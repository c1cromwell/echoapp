          type: string
        schemaId:
          type: string
        issuerDID:
          type: string
        status:
          type: string
          enum: [active, revoked, expired]
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        l1TxHash:
          type: string
