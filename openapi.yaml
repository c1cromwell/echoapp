    PassportCredentialRef:
      type: object
      properties:
        ref_id:
          type: string
        holder_did:
          type: string
        issuer_did:
          type: string
        credential_type:
          type: string
        credential_hash:
          type: string
          description: hex(SHA-256) of canonical VC bytes
        status_list_index:
          type: integer
        status_list_credential:
          type: string
        revocation_status:
          type: string
          enum: [active, revoked, unknown]
