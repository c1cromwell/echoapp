<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo — Welcome Landing</title>
<link rel="stylesheet" href="previews.css">
<style>
  .welcome-phone {
    background: var(--echo-paper) !important;
    color: var(--echo-ink);
  }
  .welcome-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 28px;
  }
  .echo-logo {
    width: 160px;
    height: 160px;
    margin-bottom: 32px;
  }
  .welcome-title {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--echo-ink);
    margin-bottom: 16px;
  }
  .welcome-sub {
    font-size: 16px;
    color: var(--echo-ink-70);
    text-align: center;
    line-height: 1.5;
  }
  .welcome-sub .bold {
    font-weight: 600;
  }
  .welcome-cta-area {
    padding: 0 28px 16px;
  }
  .welcome-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px;
    background: var(--echo-signal);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    border-radius: 14px;
    border: none;
    cursor: pointer;
  }
  .welcome-cta .arrow {
    font-size: 15px;
  }
  .welcome-secondary {
    text-align: center;
    padding: 10px 0 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--echo-ink-55);
  }
</style>
</head>
<body>

<div class="frame-col">
  <div class="phone welcome-phone">
    <div class="notch"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span></span>
    </div>

    <div class="welcome-body">
      <img class="echo-logo" src="../logos/echo-ripple-brand.svg" alt="Echo logo">

      <div class="welcome-title">ECHO</div>

      <div class="welcome-sub">
        Always Secure, Always Private<br>
        <span class="bold">Your Data, Your Community</span>
      </div>
    </div>

    <div class="welcome-cta-area">
      <button class="welcome-cta">
        Let's Go <span class="arrow">&rarr;</span>
      </button>
      <div class="welcome-secondary">I already have an account</div>
    </div>
  </div>

  <div class="caption">
    <b>Welcome Landing</b>
    Telegram-style centered layout with Echo ripple logo, tagline, and single CTA.
  </div>
</div>

</body>
</html>
