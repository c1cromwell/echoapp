  <path d="M 68 68 A 48 48 0 0 1 132 68" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 68 132 A 48 48 0 0 0 132 132" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Ripple arc pair 2 — mid -->
  <path d="M 52 52 A 68 68 0 0 1 148 52" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 52 148 A 68 68 0 0 0 148 148" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
