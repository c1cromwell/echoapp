  <path d="M 144 56 A 62 62 0 0 1 144 144" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
  <!-- Approval Stamp — lower right -->
  <circle cx="148" cy="148" r="16" stroke="#10B981" stroke-width="2" fill="#0B1120" opacity="0.9"/>
  <circle cx="148" cy="148" r="12" stroke="#10B981" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 142 148 L 146 152 L 155 143" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
