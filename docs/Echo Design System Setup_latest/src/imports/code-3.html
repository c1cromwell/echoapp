<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glacial-gradient {
            background: linear-gradient(135deg, #0F172A 0%, #0EA5E9 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
        }
        .ghost-border {
            border: 1px solid rgba(190, 200, 210, 0.15);
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-[#F8FAFC] font-body text-on-surface antialiased">
<!-- Suppressing Shell: Onboarding is a focused journey -->
<main class="min-h-screen flex flex-col items-center justify-between py-12 px-6 lg:px-12 overflow-hidden">
<!-- Header Branding -->
<div class="w-full max-w-lg flex justify-center mb-8">
<h1 class="text-2xl font-black text-on-surface tracking-tighter">ECHO</h1>
</div>
<!-- Hero Visual Section -->
<div class="relative w-full max-w-2xl flex-1 flex flex-col items-center justify-center">
<!-- Decorative "Glacial" Elements -->
<div class="absolute -z-10 w-[500px] h-[500px] bg-primary-container/10 rounded-full blur-[120px] -top-24"></div>
<!-- Main Hero Graphic -->
<div class="glacial-gradient w-full aspect-[4/3] max-h-[420px] rounded-[2.5rem] shadow-2xl shadow-primary/20 flex items-center justify-center overflow-hidden relative group">
<div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10 pointer-events-none"></div>
<!-- Abstract "Secure Connection" Visual -->
<div class="relative flex items-center justify-center">
<div class="w-48 h-48 border-2 border-white/20 rounded-full flex items-center justify-center animate-pulse">
<div class="w-32 h-32 border-2 border-white/40 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-white" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
</div>
<!-- Node Orbits -->
<div class="absolute top-0 right-0 w-8 h-8 bg-sky-300 rounded-full blur-sm"></div>
<div class="absolute bottom-4 left-8 w-6 h-6 bg-white/60 rounded-full blur-[2px]"></div>
</div>
<!-- Secure Thread Indicator (Design System Custom Component) -->
<div class="absolute top-0 left-0 w-full h-[3px] bg-primary-container shadow-[0_0_15px_#0ea5e9] opacity-80"></div>
</div>
</div>
<!-- Content Area -->
<div class="w-full max-w-xl mt-12 text-center">
<!-- Headline: Editorial Hierarchy -->
<h2 class="text-[40px] leading-[1.1] font-bold text-on-surface tracking-tight mb-4">
                ECHO: Secure, Simple, Owned by You.
            </h2>
<!-- Subtext -->
<p class="text-[15px] leading-relaxed text-on-surface-variant max-w-md mx-auto mb-10 opacity-80">
                The first truly decentralized messaging experience built on Constellation.
            </p>
<!-- Interactive Elements -->
<div class="flex flex-col items-center gap-8">
<!-- Primary Action: Glassmorphism Accented Button -->
<button class="glacial-gradient text-white px-12 py-4 rounded-full font-bold text-lg shadow-lg shadow-primary/30 hover:scale-[1.02] active:scale-95 transition-all duration-300 w-full max-w-xs flex items-center justify-center gap-2 group">
                    Get Started
                    <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Carousel Dots (8 Screens) -->
<div class="flex items-center gap-3">
<div class="w-8 h-2 glacial-gradient rounded-full"></div>
<div class="w-2 h-2 bg-surface-variant rounded-full"></div>
<div class="w-2 h-2 bg-surface-variant rounded-full"></div>
<div class="w-2 h-2 bg-surface-variant rounded-full"></div>
<div class="w-2 h-2 bg-surface-variant rounded-full"></div>
<div class="w-2 h-2 bg-surface-variant rounded-full"></div>
<div class="w-2 h-2 bg-surface-variant rounded-full"></div>
<div class="w-2 h-2 bg-surface-variant rounded-full"></div>
</div>
<!-- Secondary Quick Action -->
<button class="text-sm font-semibold text-primary hover:text-primary-container transition-colors uppercase tracking-widest">
                    Already have an account?
                </button>
</div>
</div>
<!-- Layout Footer Spacer -->
<div class="h-8 lg:h-12"></div>
