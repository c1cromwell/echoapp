<h1 class="font-['Inter'] text-2xl tracking-tight font-bold text-sky-600">ECHO</h1></div>
<div class="hidden md:flex items-center gap-8">
<button class="text-sky-600 font-semibold transition-colors hover:bg-sky-50/50 px-4 py-2 rounded-xl">Secure Login</button>
<button class="text-slate-500 hover:text-sky-500 transition-colors px-4 py-2">Get Started</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="min-h-screen pb-32 flex flex-col items-center justify-center px-4 relative overflow-hidden pt-12">
<!-- Abstract Icy Background Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-secondary-container/10 rounded-full blur-[100px]"></div>
<div class="w-full max-w-md z-10">
<!-- Hero Heading -->
<!-- Login Cards Container -->
<div class="space-y-6">
<!-- Primary Action: Passkey -->
<div class="text-center mb-8">
<p class="font-['Inter'] text-slate-500 font-medium tracking-wide">Private Messaging, Always</p>
</div><button class="group relative w-full glass-gradient p-[1px] rounded-[32px] shadow-2xl transition-transform active:scale-95 duration-200" style="background: linear-gradient(135deg, #0F172A 0%, #0EA5E9 100%);">
<div class="bg-surface-container-lowest/5 backdrop-blur-sm rounded-[31px] p-6 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-14 h-14 bg-white/10 rounded-full flex items-center justify-center border border-white/20">
<span class="material-symbols-outlined text-white text-3xl" data-icon="fingerprint" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
</div>
<div class="text-left">
<span class="block text-white font-bold text-xl">Login with Passkey</span>
<span class="block text-sky-100/70 text-sm">FaceID, TouchID, or PIN</span>
</div>
</div>
<span class="material-symbols-outlined text-white/50 group-hover:text-white transition-colors" data-icon="arrow_forward_ios">arrow_forward_ios</span>
</div>
</button>
<!-- Divider -->
<button class="flex items-center gap-4 py-4 w-full group cursor-pointer border-none bg-transparent" onclick="document.getElementById('sms-section').classList.toggle('hidden'); this.querySelector('.toggle-icon').textContent = document.getElementById('sms-section').classList.contains('hidden') ? 'expand_more' : 'expand_less'">
<div class="h-[1px] flex-1 bg-outline-variant/20 group-hover:bg-primary-container/40 transition-colors"></div>
<div class="flex items-center gap-2 px-2">
<span class="text-label text-slate-400 font-medium tracking-widest text-[10px] uppercase group-hover:text-primary-container transition-colors">Secure Alternative</span>
<span class="material-symbols-outlined text-slate-400 text-sm toggle-icon group-hover:text-primary-container transition-colors">expand_more</span>
</div>
<div class="h-[1px] flex-1 bg-outline-variant/20 group-hover:bg-primary-container/40 transition-colors"></div>
</button>
<!-- Secondary Action: SMS OTP -->
<div class="bg-surface-container-low backdrop-blur-xl p-8 rounded-[32px] shadow-sm border border-outline-variant/15 hidden" id="sms-section">
<label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 px-1">SMS Verification</label>
<div class="flex flex-col gap-4">
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-2xl px-6 py-4 text-on-surface placeholder:text-slate-400 focus:ring-2 focus:ring-primary-container/40 transition-all outline-none" placeholder="+1 (555) 000-0000" type="tel"/>
<div class="absolute inset-0 rounded-2xl border border-outline-variant/10 pointer-events-none group-focus-within:border-primary-container/40"></div>
</div>
<button class="w-full bg-surface-container-highest text-on-surface-variant font-bold py-4 rounded-2xl hover:bg-surface-bright transition-all active:scale-[0.98] flex items-center justify-center gap-2 border border-outline-variant/20">
<span>Send Code</span>
<span class="material-symbols-outlined text-lg" data-icon="chat_bubble">chat_bubble</span>
</button>
</div>
</div>
<!-- Footer Link -->
<div class="text-center">
<p class="text-on-surface-variant font-medium">
                        New to ECHO? 
                        <a class="text-primary-container font-bold ml-2 hover:underline decoration-2 underline-offset-4 transition-all" href="#" style="color: #0EA5E9;">Get Started</a>

<span class="font-['Inter'] text-[12px] font-medium tracking-[0.02em]">Get Started</span>
</button>
</nav>

<div class="fixed top-0 left-0 w-full h-[2px] bg-primary-container opacity-80 blur-[1px] z-[60]"></div>
