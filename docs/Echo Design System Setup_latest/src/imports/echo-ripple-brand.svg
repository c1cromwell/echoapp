<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ECHO Ripple Pulse Mark — Brand Color -->
  <!-- Core filled dot -->
  <circle cx="100" cy="100" r="7" fill="#0EA5E9"/>
  <!-- Inner ring 1 -->
  <circle cx="100" cy="100" r="14" stroke="#0EA5E9" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- Inner ring 2 -->
  <circle cx="100" cy="100" r="22" stroke="#0EA5E9" stroke-width="1.8" fill="none" opacity="0.6"/>
  <!-- Inner ring 3 -->
  <circle cx="100" cy="100" r="31" stroke="#0EA5E9" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Ripple arc pair 1 — close -->
  <path d="M 68 68 A 48 48 0 0 1 132 68" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 68 132 A 48 48 0 0 0 132 132" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Ripple arc pair 2 — mid -->
  <path d="M 52 52 A 68 68 0 0 1 148 52" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 52 148 A 68 68 0 0 0 148 148" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Ripple arc pair 3 — outer -->
  <path d="M 34 34 A 93 93 0 0 1 166 34" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M 34 166 A 93 93 0 0 0 166 166" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55"/>
  <!-- Side whisper arcs -->
  <path d="M 56 56 A 62 62 0 0 0 56 144" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M 144 56 A 62 62 0 0 1 144 144" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
</svg>
